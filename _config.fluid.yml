    description: 来自各行业客户的真实服务反馈
    see_more:
      text: 查看更多案例
      path: /cases/
  post_list:
    enable: true
    title: 最新文章
    description: 深度解读财税政策与实操要点
    see_more:
      text: 阅读更多文章
      path: /archives/
  stats:
    enable: true
    title: 服务数据
    list:
      - title: "18"
        unit: 年
        description: 行业经验
      - title: "30+"
        unit: 城市
        description: 服务覆盖
      - title: "14"
        unit: 大行业
        description: 深度服务
      - title: "80+"
        unit: 家
        description: 企业信赖

# ========== 文章页配置 ==========
post:
  enable: true
  # banner_img: /images/post-banner.jpg
  banner_img_height: 200
  author_info:
    enable: true
    name: 邓达华
    description: 18年财税法实战专家
    avatar: /images/founder-new.png
    social:
      - name: 微信
        icon: fab fa-weixin
        link: /images/wechat-qrcode-footer.png
  reward:
    enable: false
  copyright:
    enable: true
    author: 邓达华
    license: CC BY-NC-SA 4.0
    license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

# ========== 文章列表页 ==========
post_list:
  enable: true
  per_page: 10
  mode: pagination
  order_by: 1
  excerpt: true
  excerpt_length: 150
  force_highlight: false

# ========== 归档/标签/分类/关于 ==========
archive:
  enable: true
  per_page: 20
  order_by: -date
  count: true

tag:
  enable: false

category:
  enable: false

links:
  enable: false

about:
  enable: true
  content: |
    ## 关于存勤法税

    存勤法税服务（广州）有限公司，由18年财税法实战专家**邓达华**先生于2022年创立于广州。

    ### 创始人简介

    **邓达华**
    - 18年财、税、法领域深耕者
    - 曾任德尔惠运动、酷狗音乐集团、侨银环保股份、绿瘦健康集团财务税务核心岗位（14年甲方视角）
    - 北京市盈科（广州）律师事务所法税服务团队组建者（乙方视角）
    - 存勤法税服务（广州）有限公司 创始人/总经理
    - 中税网金牌讲师

    ### 我们的优势

    **「业财法税管五维融合」**

    从业务模式设计、到财务合规落地、到法律风险防范、到税务最优筹划、到管理体系建设——五维一体，系统解决。

    **「甲乙双视角」**

    14年甲方实战经验告诉我们老板真正担心什么，乙方专业训练让我们懂得如何专业表达。两重视角，无缝切换。

    ### 联系我们

    📞 电话：13556116691（微信同号）
    📍 地址：广东省广州市天河区
  skills:
    enable: true
    title: 核心能力
    list:
      - name: 税务筹划
        description: 合法合规的税务优化方案
        progress: 98
      - name: 涉税风险
        description: 全方位税务风险排查与应对
        progress: 95
      - name: 跨境合规
        description: ODI/FDI海外投资合规服务
        progress: 92
      - name: 企业重组
        description: 并购重组全程税务规划
        progress: 90

