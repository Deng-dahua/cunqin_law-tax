# Hexo Configuration
# https://hexo.io/zh-cn/docs/configuration

# Site
title: 存勤法税服务（广州）有限公司
subtitle: 业管财税法五维融合 | 甲乙双视角实战派
description: 专注为企业提供涉税风险检查、税务危机应对、ODI备案、企业重组税务规划等专业服务。创始人邓达华先生，18年财税法实战经验。
keywords: 业财法税融合, 财税顾问, 税务筹划, 金税四期应对, ODI备案, 企业重组, 跨境电商税务
author: 邓达华
language: zh-CN
timezone: Asia/Shanghai

# URL
## If your site is put in a subdirectory, set url as 'http://yoursite.com/child' and root as '/child/'
url: https://cunqin.tax
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - "*.xml"
  - "robots.txt"
  - "services/index.html"
  - "cases/index.html"
  - "archives/index.html"
  - "contact/index.html"
  - "services/s01-tax-risk-check.html"
  - "services/s02-tax-crisis-response.html"
  - "services/s03-odi-outbound-investment.html"
  - "services/s04-restructuring-tax-planning.html"
  - "services/s05-cross-border-legal-tax.html"
  - "services/s06-revenue-growth-strategy.html"
  - "services/s07-profit-growth-system.html"
  - "services/s08-budget-management-system.html"
  - "services/s09-fiscal-internal-control.html"
  - "services/s10-custom-tax-training.html"
  - "services/s11-annual-tax-legal-advisory.html"
  - "home-insights.json"
  - "search-index.json"

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ""
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: false

# Home page setting
index_generator:
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator_tag: false

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as you want
date_format: YYYY-MM-DD
time_format: HH:mm:ss

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
plugins:
  - hexo-generator-feed
  - hexo-generator-sitemap

# Feed
feed:
  type: atom
  path: atom.xml
  limit: 0
  hub:
  content:
  content_limit: 140
  content_limit_delim: "..."
  order_by: -date

# Sitemap
sitemap:
  path: sitemap.xml
  rel: true
  tags: true
  categories: true

# Markdown
markdown:
  plugins:
    - markdown-it-footnote
    - markdown-it-sup
    - markdown-it-sub
    - markdown-it-abbr
    - markdown-it-emoji
    - markdown-it-task-lists
    - markdown-it-mark

# Theme
theme: fluid

# Avatar
avatar: /images/founder.jpg

# Post
post:
  # Enable table of contents
  toc: true
  # Styles for reading progress bar
  progressBar: true

# Comments
comments:
  enable: false
  type: disqus
  shortname: cunqin-law-tax

# Customization
favicon: /images/nav-logo.png

# Deployment
# Hexo Deployer Git (https://github.com/hexojs/hexo-deployer-git)
deploy:
  type: git
  repo: git@github.com:Deng-dahua/cunqin_law-tax.git
  branch: gh-pages
  message: "Site updated: {{ now('YYYY-MM-DD HH:mm:ss') }}"
