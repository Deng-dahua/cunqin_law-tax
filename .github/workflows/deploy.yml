name: Deploy Hexo to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Hexo site
        run: |
          npx hexo clean
          npx hexo generate

      - name: Override homepage with custom home.html
        run: |
          echo "Overriding public/index.html with custom homepage..."
          cp source/首页(source).html public/index.html
          echo "Done. Custom homepage applied."

      - name: Restore original filenames for deployment
        run: |

# 还原中文文件名到原始 URL 路径（机器自动生成）
mv "public/404(public).html" "public/404.html"
mv "public/Atom订阅(public).xml" "public/atom.xml"
mv "public/index(public).html" "public/index.html"
mv "public/local-search(public).xml" "public/local-search.xml"
mv "public/爬虫规则(public).txt" "public/robots.txt"
mv "public/网站地图(public).xml" "public/sitemap.xml"
mv "public/about/index(public).html" "public/about/index.html"
mv "public/archives/index(public).html" "public/archives/index.html"
mv "public/articles/高新技术企业税务规划(public).html" "public/articles/gaoxin-qiye-shuiwu.html"
mv "public/articles/甲乙双视角税务顾问(public).html" "public/articles/jiayi-shuangshijing.html"
mv "public/articles/金税四期全面解读(public).html" "public/articles/jinshui-siqi-yingdui.html"
mv "public/articles/跨境电商税务合规(public).html" "public/articles/kuajing-dianshang-shuiwu.html"
mv "public/articles/ODI境外投资备案全流程(public).html" "public/articles/odi-beian-quanliucheng.html"
mv "public/articles/企业税务风险管控(public).html" "public/articles/qiye-shuiwu-fengxian.html"
mv "public/articles/企业重组税务规划(public).html" "public/articles/qiye-zhongzu-shuiwu.html"
mv "public/articles/业管财税法五维融合(public).html" "public/articles/yecai-fasui-ronghe.html"
mv "public/cases/index(public).html" "public/cases/index.html"
mv "public/contact/index(public).html" "public/contact/index.html"
mv "public/css/自定义样式(public).css" "public/css/custom.css"
mv "public/css/gitalk(public).css" "public/css/gitalk.css"
mv "public/css/highlight-dark(public).css" "public/css/highlight-dark.css"
mv "public/css/highlight(public).css" "public/css/highlight.css"
mv "public/css/main(public).css" "public/css/main.css"
mv "public/js/boot(public).js" "public/js/boot.js"
mv "public/js/color-schema(public).js" "public/js/color-schema.js"
mv "public/js/events(public).js" "public/js/events.js"
mv "public/js/img-lazyload(public).js" "public/js/img-lazyload.js"
mv "public/js/leancloud(public).js" "public/js/leancloud.js"
mv "public/js/local-search(public).js" "public/js/local-search.js"
mv "public/js/openkounter(public).js" "public/js/openkounter.js"
mv "public/js/plugins(public).js" "public/js/plugins.js"
mv "public/js/umami-view(public).js" "public/js/umami-view.js"
mv "public/js/utils(public).js" "public/js/utils.js"
mv "public/services/index(public).html" "public/services/index.html"
mv "public/services/涉税风险检查(public).html" "public/services/s01-tax-risk-check.html"
mv "public/services/税务危机应对与争议解决(public).html" "public/services/s02-tax-crisis-response.html"
mv "public/services/跨境投资与并购(public).html" "public/services/s03-odi-outbound-investment.html"
mv "public/services/企业重组与重大交易税务规划(public).html" "public/services/s04-restructuring-tax-planning.html"
mv "public/services/跨境法律及税务规划(public).html" "public/services/s05-cross-border-legal-tax.html"
mv "public/services/营收增长战略咨询(public).html" "public/services/s06-revenue-growth-strategy.html"
mv "public/services/利润增长体系建设(public).html" "public/services/s07-profit-growth-system.html"
mv "public/services/全面预算管理体系建设(public).html" "public/services/s08-budget-management-system.html"
mv "public/services/财税内控体系建设(public).html" "public/services/s09-fiscal-internal-control.html"
mv "public/services/财税内训课程定制(public).html" "public/services/s10-custom-tax-training.html"
mv "public/xml/local-search(public).xml" "public/xml/local-search.xml"


      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
