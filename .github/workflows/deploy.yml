name: Deploy Hexo to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Patch theme (comment out missing _links import)
        run: |
          sed -i 's|@import "_links/\*"|// @import "_links/*"|' node_modules/hexo-theme-fluid/source/css/_pages/pages.styl

      - name: Build Hexo site
        run: |
          npx hexo clean
          npx hexo generate

      - name: Override homepage
        run: |
          echo "Overriding public/index.html with custom homepage..."
          cp source/首页(source).html public/index.html
          echo "Done."


      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
