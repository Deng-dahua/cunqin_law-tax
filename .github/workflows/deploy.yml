name: Deploy Hexo to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Patch theme (ensure _links dir exists to prevent stylus import error)
        run: |
          LINKS_DIR="node_modules/hexo-theme-fluid/source/css/_pages/_links"
          if [ ! -d "$LINKS_DIR" ]; then
            mkdir -p "$LINKS_DIR"
            echo "/* placeholder */" > "$LINKS_DIR/index.styl"
          fi

      - name: Build Hexo site
        run: |
          npx hexo clean
          npx hexo generate

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
