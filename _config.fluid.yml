# fluid theme configuration
# https://fluid.dev/

# ========== 全局样式 ==========
custom_css:

# ========== 导航栏 ==========
navbar:
  blog_title: 存勤法税
  enable: true
  fixed: true
  transparent: false
  brand_color: "#1a365d"
  links:
    首页:
      path: /
      icon: fas fa-home
    关于:
      path: /about/
      icon: fas fa-user
    服务:
      path: /services/
      icon: fas fa-handshake
    案例:
      path: /cases/
      icon: fas fa-briefcase
    文章:
      path: /archives/
      icon: fas fa-book
    联系:
      path: /contact/
      icon: fas fa-envelope

